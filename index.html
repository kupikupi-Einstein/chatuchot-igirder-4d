#hud .rec{color:#ff4d4d}
#caption{position:fixed;left:50%;bottom:14vh;transform:translateX(-50%);z-index:6;font-size:22px;font-weight:600;padding:10px 22px;display:none;text-align:center;max-width:86vw}

function buildProject(api) {
  const { THREE, M, mesh, member, addEl, date, label, D, DAY, addD, L2, lerp, clamp, R } = api;
  const HR = 3600000; G.HR = HR; G.api = api;
  cars.count = 0;                                                   // engine traffic not used – own one-way carriageways below
  const pad2 = n => String(n).padStart(2, '0');
  const ss = u => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u); G.ss = ss;
  // ---------------- geometry constants ----------------
  const XS = [0]; SPANS.forEach(s => XS.push(XS.at(-1) + s)); G.XS = XS;
  const PL = 0.05, PAD = 0.088, DS = 0.025;                          // mortar pad / elastomeric bearing / girder down-stand (BEARING TYPE 2 = 0.163)
  const LEDGE = j => PIERS[j].bch - DATUM + .8, SEAT = j => LEDGE(j) + PL + PAD + DS;     // ledge top / girder soffit at support j
  // Lifting-plan drawings (Method Erection I Girder.pdf): chainage increases to the right; girders 1–3 (first batch) are on the lower side of the
  // drawing, the trailer and crane #1 (second batch) on the upper side. SD = +1 maps the drawing's lower side to z+ (right of +x); set SD = -1 to mirror.
  const SD = 1; G.SD = SD;
  const GZ = [5.75, 3.45, 1.15, -1.15, -3.45, -5.75].map(z => z * SD);   // girder lines G1..G6 (G1, G6 = edge C-girders CFV; G2–G5 = I-girders IFV)
  const gL = s => s - 2.1, gW = L => Math.round(L < 18.5 ? 38 : 38 + (L - 17.95) * 20 / (27.9 - 17.95));
  const SH = SPANS.map(() => 1.70);                                 // I-girder depth 1.70 m (SUB TYPE S-1: …+I-Girder(1.70)+Crossbeam(0.80))
  const stemTop = j => LEDGE(j) + STEM;
  const LH = [7.0, 8.25, 9.5, 12.0, 13.25, 14.5]; G.LH = LH;        // lift start hour of girders G1..G6 on the erection day
  const LIFT = .75 * HR;
  /* Two lifting cases from "Method Erection I Girder.pdf" (crane slew centres measured on the plans, metres):
     c1 = crane #1 [dx from the start pier, z] for batch 1 (girders 1–3) / batch 2 (girders 4–6); c2 = crane #2 [dx from the end pier, z];
     tr = pole trailer as drawn: [girder-centre dx from the start pier (on a 20 / 30 m span), distance towards the upper side, angle° (end B up +)].
          Batch 1 parks parallel along the upper edge; batch 2 parks across the next support (Case A: just past the end pier, Case B: diagonally from inside

  function fromTokens(toks) { const dur = /^\d+(\.\d+)?\s*e?(days?|d|wks?|w|hrs?|h|mons?|mo|วัน)\??$/i, dt = /(\d{1,2}\/\d{1,2}\/\d{2,4})/, tasks = new Map();

      if (!dur.test(toks[j]) && toks[j + 1] && dur.test(toks[j + 1]) && !dt.test(toks[j])) { name += ' ' + toks[j]; j++; } if (!dur.test(toks[j])) continue;
