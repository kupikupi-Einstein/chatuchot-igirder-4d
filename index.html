#hud .cross:after{top:50%;left:40%;right:40%;height:1px}
#hud .rec{color:#ff4d4d}
#caption{position:fixed;left:50%;bottom:14vh;transform:translateX(-50%);z-index:6;font-size:22px;font-weight:600;padding:10px 22px;display:none;text-align:center;max-width:86vw}

#flyhelp{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:6;padding:6px 14px;display:none;font-size:12px}

#impStatus{font-size:12px;line-height:1.55;margin:8px 0;white-space:pre-wrap}

.mrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:10px}
#schedSrc{font-size:11px;color:var(--mut);margin-top:2px}

  hse: ['<h3>ความปลอดภัย / สิ่งแวดล้อม / จราจร (MS §7)</h3><ul class="mut" style="padding-left:16px;font-size:11.5px"><li>ประชุมชี้แจงขั้นตอน (Toolbox talk) ทุกวัน · ตรวจเครื่องมือ/เครน/สลิงก่อนใช้งาน</li><li>Lifting plan ทุก Span · ห้ามคนอยู่ใต้รัศมีการยก · ผู้ให้สัญญาณเครนที่ผ่านการอบรม</li><li>ทำงานบนที่สูง: Full-body harness + Lifeline บนคาน (PPT slide 65–66)</li><li>PPE ครบ · กั้นพื้นที่ทำงาน · ป้ายเตือน · ไฟส่องสว่างกลางคืน</li><li>ฝุ่น/เสียง: ฉีดน้ำ ทำความสะอาดล้อรถ · ไม่ทิ้งวัสดุลงทางระบายน้ำ</li><li>จราจร: ปฏิบัติตามแผนจัดการจราจรที่ได้รับอนุมัติ · ประชาสัมพันธ์ ≥ 7 วัน</li><li>เอกสารแนบ: ITP · QC checklist · Inspection sheet · JSA</li></ul>', '<h3>Safety / environment / traffic (MS §7)</h3><ul class="mut" style="padding-left:16px;font-size:11.5px"><li>Daily toolbox talk · inspect tools, cranes and slings before use</li><li>Lifting plan for every span · nobody under the load · certified signaller</li><li>Work at height: full-body harness + lifeline on girders (PPT slides 65–66)</li><li>Full PPE · barricaded work zone · warning signs · night lighting</li><li>Dust / noise: water spraying, wheel washing · nothing into drains</li><li>Traffic: approved TMP · public notice ≥ 7 days</li><li>Attachments: ITP · QC checklist · inspection sheet · JSA</li></ul>'],
  info: ['<h3>แหล่งข้อมูล</h3><ul class="mut" style="padding-left:16px;font-size:11.5px"><li><b>MS</b> ITD/RB2/J.2599/QES/MS/S1/01 Rev.2 – วิธีการติดตั้งคานหน้าตัดรูปตัว I และ C (ขั้นตอน §6, STEP 1–6, Front elevation / Side bracing / Detail 1–2)</li><li><b>PPT</b> Method Erection I Girder Rev.140869 – เครน 2 × 100–220 t, ZTC1100R Load chart, Lifting plan 74.05 % / 72.66 %, ลำดับยก 1–8, เส้นทางขนส่ง 44 กม., รถหางสาลี่</li><li><b>PDF</b> Method Erection I Girder (23 หน้า) – ตำแหน่งเครน / รถขนส่ง / รัศมียก 2 กรณี: Case A Span 18 m 38 t (หน้า 1–10), Case B Span 20–30 m 58 t (หน้า 11–23) · ชื่อคาน P0L-1…P2L-6 (CFV = C-Girder ริม, IFV = I-Girder ใน) · สถานีตอม่อ EJ 0-000.853, MLP1-01 0+019.193, MLP1-02 0+039.193, MLP1-03 0+069.193</li><li><b>PDF</b> ขออนุมัติปิดเบี่ยงจราจร I-girder – ไหล่ทางขวาขาเข้า 500 ม. (24 ต.ค. 69 – 25 ก.พ. 70), ไหล่ทางซ้าย 300 ม. (23–25 ต.ค. 69)</li></ul><h3>ข้อมูลหลักที่ใช้</h3><ul class="mut" style="padding-left:16px;font-size:11.5px"><li>Span 1 = 20.046 m, Span 2 = 20.000 m (Lifting plan) · คาน P0L 17.93 m · 38 t</li><li>คาน 6 แนว / Span · ยกคานตัวริมก่อน (G1) → G6</li><li>เครน ZTC1100R Main boom 21.6 m · R 8–12 m</li></ul><h3>สมมติฐาน (Assumed)</h3><ul class="mut" style="padding-left:16px;font-size:11.5px"><li>แบบ Lifting plan ไม่ระบุทิศ: ใช้ด้านล่างของแบบ (คานชุดแรก) = ฝั่งขวาเมื่อมองตาม +x (ฝั่งขาเข้า), ด้านบน (รถขนส่ง / เครนชุดหลัง) = ฝั่งขาออกของเกาะกลาง – สลับได้ด้วยค่า SD ในไฟล์</li><li>ไม่มีแบบ General layout / Programme: ความยาว Span 5–18 (25/30 m), ระยะห่างคาน 2.30 m, ความลึกคาน 1.20/1.45/1.65 m, ระดับคานหัวเสา +8.0 m, รูปเสา/คานหัวเสาตาม Front elevation ใน MS</li><li>รอบงาน 6 วัน/Span ภายในช่วงปิดเบี่ยง · เวลาในวันยกตาม PPT ขั้นตอน 1–8</li><li>ตำแหน่งด่านฯ / โครงสร้างเดิม / ถนนคู่ขนาน / บ่อน้ำ เป็นตำแหน่งโดยประมาณ</li><li>คานริม (CFV) แสดงเป็นหน้าตัดเดียวกับ I-Girder – รูปหน้าตัด C-Girder จริงตาม Shop drawing</li></ul><h3>พิกัด</h3><p class="mut" style="font-size:11.5px">x = ระยะตามแนวสะพานจาก EJ (ทิศขาออก), z+ = ด้านขวาเมื่อมองตาม +x e per shop drawing</li></ul><h3>Coordinates</h3><p class="mut" style="font-size:11.5px">x = chainage along the viaduct from the EJ (outbound), z+ = right looking along +x = inbound side, y = height above the carriageway</p>'],

    const canal = mesh(new THREE.PlaneGeometry(LEN, 7), new THREE.MeshStandardMaterial({ color: 0x5f7d62, roughness: .3, metalness: .2 })); canal.rotation.x = -Math.PI / 2; canal.position.set(XC, .025, -40); ctxAdd(canal);
    const pond = mesh(new THREE.CircleGeometry(1, 48), new THREE.MeshStandardMaterial({ color: 0x4f7f8c, roughness: .15, metalness: .3 })); pond.rotation.x = -Math.PI / 2; pond.scale.set(170, 62, 1); pond.position.set(235, .025, 116); ctxAdd(pond);

  { // barriers (outbound inner edge full length; inbound inner edge only outside the work zone), lamp posts on outer edges
